name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: docucast-app
            docker_target: app-runtime
          - image_name: docucast-reverb
            docker_target: app-runtime
          - image_name: docucast-nginx
            docker_target: nginx-runtime

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.image_name }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.docker_target }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image_name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image_name }}:${{ github.sha }}
          build-args: |
            FRONTEND_APP_NAME=${{ vars.VITE_APP_NAME }}
            FRONTEND_REVERB_CLIENT=${{ secrets.VITE_REVERB_APP_KEY }}
            FRONTEND_REVERB_HOST=${{ vars.VITE_REVERB_HOST }}
            FRONTEND_REVERB_PORT=${{ vars.VITE_REVERB_PORT }}
            FRONTEND_REVERB_SCHEME=${{ vars.VITE_REVERB_SCHEME }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-images
    steps:

      - name: Deploy to Hostinger
        uses: hostinger/deploy-action@v1
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
