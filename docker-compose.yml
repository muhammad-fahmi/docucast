# Docker Compose configuration for DocuCast Laravel application
# Development environment with Traefik, PostgreSQL 18, Redis, and Reverb WebSocket server

services:
  # # ==========================================
  # # Traefik - Reverse Proxy and Router
  # # ==========================================
  traefik:
    image: traefik:v3.6
    container_name: traefik
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=docucast_edge
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
      # - "8080:8080" # Commented out to avoid conflict with Reverb WebSocket server on host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - edge
    restart: unless-stopped

  # ==========================================
  # App - PHP-FPM with Laravel application and Queue Worker
  # ==========================================
  app:
    build: &app-build
      context: .
      target: app-runtime
      args:
        FRONTEND_APP_NAME: ${VITE_APP_NAME:?VITE_APP_NAME is required}
        FRONTEND_REVERB_CLIENT: ${VITE_REVERB_APP_KEY:?VITE_REVERB_APP_KEY is required}
        FRONTEND_REVERB_HOST: ${VITE_REVERB_HOST:?VITE_REVERB_HOST is required}
        FRONTEND_REVERB_PORT: ${VITE_REVERB_PORT:?VITE_REVERB_PORT is required}
        FRONTEND_REVERB_SCHEME: ${VITE_REVERB_SCHEME:?VITE_REVERB_SCHEME is required}
    image: 1808561084/docucast-app:v1
    container_name: docucast-app
    environment: &app-env
      - APP_NAME=${APP_NAME}
      - APP_ENV=${APP_ENV}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG}
      - APP_URL=${APP_URL}
      - ASSET_URL=${ASSET_URL}
      - APP_LOCALE=${APP_LOCALE}
      - APP_FALLBACK_LOCALE=${APP_FALLBACK_LOCALE}
      - APP_FAKER_LOCALE=${APP_FAKER_LOCALE}
      - APP_MAINTENANCE_DRIVER=${APP_MAINTENANCE_DRIVER}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS}
      - LOG_CHANNEL=${LOG_CHANNEL}
      - LOG_STACK=${LOG_STACK}
      - LOG_DEPRECATIONS_CHANNEL=${LOG_DEPRECATIONS_CHANNEL}
      - LOG_LEVEL=${LOG_LEVEL}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=${POSTGRES_INITDB_ARGS}
      - SESSION_DRIVER=${SESSION_DRIVER}
      - SESSION_LIFETIME=${SESSION_LIFETIME}
      - SESSION_ENCRYPT=${SESSION_ENCRYPT}
      - SESSION_PATH=${SESSION_PATH}
      - SESSION_DOMAIN=${SESSION_DOMAIN}
      - CACHE_STORE=${CACHE_STORE}
      - CACHE_PREFIX=${CACHE_PREFIX}
      - REDIS_CLIENT=${REDIS_CLIENT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION}
      - QUEUE_FAILED_TABLE=${QUEUE_FAILED_TABLE}
      - BROADCAST_DRIVER=${BROADCAST_DRIVER}
      - BROADCAST_CONNECTION=${BROADCAST_CONNECTION}
      - MAIL_MAILER=${MAIL_MAILER}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_BUCKET=${AWS_BUCKET}
      - AWS_USE_PATH_STYLE_ENDPOINT=${AWS_USE_PATH_STYLE_ENDPOINT}
      - FILESYSTEM_DISK=${FILESYSTEM_DISK}
      - MEMCACHED_HOST=${MEMCACHED_HOST}
      - COMPOSER_ALLOW_SUPERUSER=${COMPOSER_ALLOW_SUPERUSER}
      - TELESCOPE_ENABLED=${TELESCOPE_ENABLED}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS}
      - SEED_DATABASE=${SEED_DATABASE}
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
      - REVERB_HOST=${REVERB_HOST}
      - REVERB_PORT=${REVERB_PORT}
      - REVERB_SCHEME=${REVERB_SCHEME}
      - VITE_APP_NAME=${VITE_APP_NAME}
      - VITE_REVERB_APP_KEY=${VITE_REVERB_APP_KEY}
      - VITE_REVERB_HOST=${VITE_REVERB_HOST}
      - VITE_REVERB_PORT=${VITE_REVERB_PORT}
      - VITE_REVERB_SCHEME=${VITE_REVERB_SCHEME}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - 9000
    volumes:
      # Mount project directory for local development; persist storage
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/public/build
      - app-storage:/var/www/html/storage
    networks:
      - internal
    restart: unless-stopped

  # ==========================================
  # Nginx - Web Server
  # ==========================================
  nginx:
    build:
      context: .
      target: nginx-runtime
    image: 1808561084/docucast-nginx:v1
    container_name: docucast-nginx
    depends_on:
      - app
    volumes:
      # Mount project directory for local development; share storage
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/public/build
      - app-storage:/var/www/html/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      # Traefik configuration for routing
      - traefik.enable=true
      - traefik.docker.network=docucast_edge
      - traefik.http.routers.docucast-web.rule=Host(`docucast.localhost`)
      - traefik.http.routers.docucast-web.entrypoints=web
      - traefik.http.services.docucast-web.loadbalancer.server.port=80
    networks:
      - edge
      - internal
    restart: unless-stopped

  # ==========================================
  # Reverb - WebSocket Server for Real-time Notifications
  # ==========================================
  reverb:
    build: *app-build
    image: 1808561084/docucast-app:v1
    container_name: docucast-reverb
    command: php artisan reverb:start
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - 8080
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'php -r ''$$s=@fsockopen("127.0.0.1",8080); exit($$s?0:1);''',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      # Mount project directory for local development; share storage
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/public/build
      - app-storage:/var/www/html/storage
    labels:
      # Traefik configuration for routing websocket connections through port 80/443
      - traefik.enable=true
      - traefik.docker.network=docucast_edge
      - traefik.http.routers.docucast-reverb.rule=Host(`docucast.localhost`) && (PathPrefix(`/app`) || PathPrefix(`/apps`))
      - traefik.http.routers.docucast-reverb.entrypoints=web
      - traefik.http.services.docucast-reverb.loadbalancer.server.port=8080
    networks:
      - edge
      - internal
    restart: unless-stopped

  # ==========================================
  # PostgreSQL 18 - Database
  # ==========================================
  db:
    image: postgres:18.3
    container_name: docucast-db
    environment:
      # Database initialization
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_DB: ${DB_DATABASE:-docucast}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---locale=C --encoding=UTF8}
    healthcheck:
      # Use $$ so Docker evaluates the container's own env vars at runtime
      test:
        [
          "CMD-SHELL",
          "pg_isready -q -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      # First run initialises the data directory - give it enough time
      start_period: 60s
    expose:
      - 5432
    volumes:
      # Persistent database data storage
      - postgres-data:/var/lib/postgresql
    networks:
      - internal
    restart: unless-stopped

  # ==========================================
  # Redis - Cache and Session Storage
  # ==========================================
  redis:
    image: redis:alpine
    container_name: docucast-redis
    environment: *app-env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--save", "60", "1"]
    expose:
      - 6379
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      # Persistent Redis data storage
      - redis-data:/data
    networks:
      - internal
    restart: unless-stopped

# ==========================================
# Named Volumes - Persistent Data Storage
# ==========================================
volumes:
  app-storage:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local

# ==========================================
# Networks - Service Communication
# ==========================================
networks:
  # External network for Traefik to expose services
  edge:
    driver: bridge

  # Internal network for service-to-service communication
  internal:
    driver: bridge
