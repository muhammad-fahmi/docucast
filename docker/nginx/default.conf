# Nginx Server Block Configuration for Laravel Application
# Handles HTTP requests and routes them to PHP-FPM

server {
    # Listen on HTTP port 80 for all requests
    listen 80;
    server_name _;

    # Document root pointing to Laravel public directory
    root /var/www/html/public;
    index index.php index.html;

    # Allow large file uploads (50MB)
    client_max_body_size 50M;

    # ==========================================
    # Security Headers
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ==========================================
    # Static Assets Caching
    # ==========================================
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ==========================================
    # Health Check Endpoint
    # ==========================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ==========================================
    # Favicon and Robots
    # ==========================================
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # ==========================================
    # Laravel Routes
    # ==========================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ==========================================
    # PHP Request Handling
    # ==========================================
    location ~ \.php$ {
        # Include FastCGI standard parameters
        include fastcgi_params;

        # Set FastCGI parameters for PHP-FPM communication
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;

        # Connect to PHP-FPM upstream
        fastcgi_pass php-fpm;
        fastcgi_index index.php;

        # FastCGI optimization
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
    }

    # ==========================================
    # Security - Hide Hidden Files
    # ==========================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
