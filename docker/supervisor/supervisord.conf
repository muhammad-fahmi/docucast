# Supervisor Configuration File
# Manages multiple processes in the PHP-FPM application container:
# - PHP-FPM daemon (application server)
# - Laravel Queue Worker (background job processor)

[supervisord]
# Main supervisord process configuration
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

# ==========================================
# Event Listeners
# ==========================================
# Exit event listener - allows graceful shutdown of supervisor
[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ==========================================
# PHP-FPM Process
# ==========================================
# Manages the PHP-FPM master process
[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/php-fpm.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisor/php-fpm-error.log
stderr_logfile_maxbytes=0
redirect_stderr=true
user=root
process_name=%(program_name)s_%(process_num)02d
numprocs=1

# ==========================================
# Laravel Queue Worker
# ==========================================
# Runs as background process to handle queued jobs
[program:laravel-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --timeout=90
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-worker.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisor/queue-worker-error.log
stderr_logfile_maxbytes=0
user=www-data
directory=/var/www/html

# Supervisor will try to restart the queue worker if it exits unexpectedly
[program:laravel-schedule]
process_name=%(program_name)s
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/schedule.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisor/schedule-error.log
stderr_logfile_maxbytes=0
user=www-data
directory=/var/www/html
